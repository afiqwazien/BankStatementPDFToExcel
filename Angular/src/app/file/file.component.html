
  <p-fileUpload
      #uploader
      mode="advanced"
      name="bankfile"
      [multiple]="false"
      accept="application/pdf"
      maxFileSize="1000000"
      [customUpload]="true"
      (uploadHandler)="onCustomUpload($event)"
      [auto]="false"
      chooseLabel="Browse"
      uploadLabel="Convert to Excel"
      cancelLabel="Clear"
      [disabled]="loading"
      styleClass="modern-uploader"
    >
      <ng-template pTemplate="content">
        <div
          class="flex flex-col items-center justify-center p-10 border-2 border-dashed border-sky-600 rounded-md bg-slate-900/40 text-gray-300 hover:bg-slate-800 transition-all"
        >
          <i class="pi pi-cloud-upload text-5xl text-sky-400 mb-3"></i>
          <p class="text-gray-300">Drop your PDF here or click “Browse”</p>
        </div>
      </ng-template>
    </p-fileUpload>

  <!-- Loading animation -->
  <div *ngIf="loading" class="flex flex-col items-center justify-center mt-8 animate-fadeIn">
    <i class="pi pi-spin pi-spinner text-sky-400 text-4xl mb-2"></i>
    <p class="text-sm text-gray-300">Processing your file...</p>
  </div>

  <!-- Success message -->
  <p-toast></p-toast>
